name: Native PostgreSQL concurrency gate
'on':
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/native-postgres.yml
      - database/postgres/**
      - tests/native/**
      - tests/postgres/bootstrap.sql
permissions:
  contents: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        postgres: [17, 18]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_PASSWORD: followkit-disposable-ci-only
        ports:
          - 127.0.0.1:5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Check offline staging preflight
        run: node --test tests/staging-preflight.test.mjs
      - run: npm ci --prefix tests/native
      - name: Check configuration guards
        run: npm --prefix tests/native run test:guards
      - name: Run five native groups three times with fresh databases
        shell: bash
        env:
          FOLLOWKIT_NATIVE_TEST_URL: postgresql://postgres:followkit-disposable-ci-only@127.0.0.1:5432/postgres
        run: |
          set -euo pipefail
          for iteration in 1 2 3; do
            echo "Native concurrency iteration ${iteration}/3"
            npm --prefix tests/native test
          done

